server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded PDFs never reach this server; only the app files are served.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/wasm application/json;
    gzip_min_length 1024;

    # Nginx does not know the .mjs extension; browsers only run modules served as JavaScript.
    # (pdf.js, which renders thumbnails and previews, is shipped as .mjs.)
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Hashed build assets and the compression engine: cache for 30 days.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location /gs/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "no-referrer";
        try_files $uri /index.html;
    }
}
